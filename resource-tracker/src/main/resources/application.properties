# ===============================
# PostgreSQL Database Configuration
# ===============================

# Force PostgreSQL Dialect to stop "Unable to determine Dialect" errors
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ensure the server binds to all interfaces and uses the Railway port
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# Replace harsh1344 with 'local_password' below if you don't want harsh1344 on GitHub at all
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# Spring AI Gemini Configuration
# ===============================
spring.ai.openai.api-key=${GEMINI_API_KEY:dummy_local_key}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-1.5-flash